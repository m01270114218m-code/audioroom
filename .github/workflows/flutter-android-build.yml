name: Flutter Android build (no audio)

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/supabase-integration]
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build Android debug APK (microphone disabled)
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: audioroom-no-audio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
